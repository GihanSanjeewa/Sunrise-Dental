# =============================================================================
# Sunrise Dental Clinic Automated Testing Configuration
# Uses isolated in-memory H2 database to prevent touching production data.
# =============================================================================

server.port=0

spring.datasource.url=jdbc:h2:mem:sunrise_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.com.sunrise.dental=INFO
logging.level.org.hibernate=WARN
