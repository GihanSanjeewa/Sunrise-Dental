# =============================================================================
# Sunrise Dental Clinic Application Configuration
# Server, Database, Hibernate JPA, and Swagger Settings
# =============================================================================

server.port=8080
server.servlet.context-path=/

# -----------------------------------------------------------------------------
# Database Configuration (MySQL / XAMPP)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/sunrise_dental_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------------
# Hibernate JPA Configuration
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# Static Resources Configuration
# -----------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/

# -----------------------------------------------------------------------------
# OpenAPI / Swagger Documentation
# -----------------------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
logging.level.com.sunrise.dental=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
